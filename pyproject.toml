[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portopt"
version = "1.0.0"
description = "Calmar, Martin and Pain ratio portfolio optimisation with weekly out-of-sample backtests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shreyash Kawle" }]
dependencies = ["numpy>=1.24", "scipy>=1.11", "cvxpy>=1.4", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
